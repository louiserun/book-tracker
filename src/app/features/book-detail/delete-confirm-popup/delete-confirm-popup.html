<app-popup title="Supprimer ce livre ?" (closed)="close()">
  <p class="popup-warning">
    Cette action est définitive. "{{ bookTitle() }}" sera supprimé de ta bibliothèque.
  </p>
  <div popup-footer class="popup-actions">
    <button class="delete-confirm" (click)="confirm()">Supprimer</button>
    <button class="cancel" (click)="close()">Annuler</button>
  </div>
</app-popup>
